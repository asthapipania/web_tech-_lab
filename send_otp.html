<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send OTP</title>
  <style>
    /* (CSS remains the same as the previous code you provided) */
  </style>
</head>
<body>
  <h1>Send OTP</h1>
  <form id="sendOTPForm">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <button type="submit">Send OTP</button>
  </form>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sendOTPForm = document.getElementById('sendOTPForm');

      if (sendOTPForm) {
        sendOTPForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = sendOTPForm.elements.email.value;
          
          // API to send OTP to email
          const response = await fetch(`/api/sendOTP?email=${encodeURIComponent(email)}`);
          const result = await response.json();
          
          alert(result.message);
          
          if (result.success) {
            // Store email in localStorage to use in verify page
            localStorage.setItem('email', email);
            window.location.href = 'verifyOTP.html';
          }
        });
      }
    });
  </script>
</body>
</html>
